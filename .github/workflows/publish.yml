name: Publish to the Wizard App Index
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - run: python3 app/build_view.py
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish (the index re-reads this repo and runs the wizard.md check)
        run: |
          curl -sS --fail-with-body -X POST https://apps.aiwizards.com/v1/publish \
            -H 'content-type: application/json' \
            -d "{\"repo\":\"${{ github.repository }}\"}"
